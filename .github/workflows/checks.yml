name: Check project sources

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q tools
          node --check prototype/app.js
      - name: Reproduce committed mesh and materials
        run: |
          python tools/generate_goal_net.py --output "$RUNNER_TEMP/goal-net"
          cmp assets/goal_net.obj "$RUNNER_TEMP/goal-net/goal_net.obj"
          cmp assets/goal_net.mtl "$RUNNER_TEMP/goal-net/goal_net.mtl"
